# HashiCorp Vault — Secrets Management
# Dev mode for home lab (in-memory, unsealed). For production, use raft storage + auto-unseal.

services:
  vault:
    image: hashicorp/vault:1.18.3
    container_name: vault
    restart: unless-stopped
    ports:
      - "8200:8200"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=${VAULT_ROOT_TOKEN:-root}
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
      - VAULT_ADDR=http://127.0.0.1:8200
    volumes:
      - ./config/vault.hcl:/vault/config/vault.hcl:ro
      - ./init:/vault/init:ro
      - vault_data:/vault/data
      - vault_logs:/vault/logs
    networks:
      - vault_net
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 128M

networks:
  vault_net:
    driver: bridge

volumes:
  vault_data:
    driver: local
  vault_logs:
    driver: local