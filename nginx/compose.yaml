---

services:
  nginx:
    image: nginx:1.29.8
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro

      - ./nginx/logs:/var/log/nginx
    networks:
      - homelab_net

networks:
  homelab_net:
    external: true
    name: homelab_net
