services:
  excalidraw:
    image: excalidraw/excalidraw:${EXCALIDRAW_VERSION:-sha-4bfc5bb}
    container_name: excalidraw
    ports:
      - "3000:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3