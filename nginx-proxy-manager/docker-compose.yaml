services:
  nginx-proxy-manager:
    image: "docker.io/jc21/nginx-proxy-manager:2.15.1"
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    volumes:
      - /var/data/nginx-proxy-manager/data:/data
      - /var/data/nginx-proxy-manager/letsencrypt:/etc/letsencrypt
    networks:
      - homelab_net

networks:
  homelab_net:
    external: true
    name: homelab_net
