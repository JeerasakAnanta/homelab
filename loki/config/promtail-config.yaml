server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Docker container logs (via Docker logging driver)
  - job_name: docker-containers
    static_configs:
      - labels:
          job: docker-containers
          __path__: /var/lib/docker/containers/*/*-json.log
    pipeline_stages:
      - json:
          expressions:
            log: log
            stream: stream
            container_id: container_id
            container_name: container_name
            image_name: image_name
      - labels:
          container_name:
          image_name:
      - output:
          source: log

  # Systemd journal (system services)
  - job_name: systemd-journal
    static_configs:
      - labels:
          job: systemd-journal
          __path__: /run/systemd/journal
    pipeline_stages:
      - json:
          expressions:
            message: MESSAGE
            unit: _SYSTEMD_UNIT
            priority: PRIORITY
      - labels:
          unit:
      - match:
          selector: '{unit=~".+"}'
          action: keep

  # Host /var/log files (nginx, auth, etc.)
  - job_name: host-logs
    static_configs:
      - labels:
          job: host-logs
          __path__: /var/log/*log
    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\S+) (?P<host>\S+) (?P<message>.*)$'
      - labels:
          host:
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      - output:
          source: message

  # Loki self-logs
  - job_name: loki
    static_configs:
      - labels:
          job: loki
          __path__: /loki/logs/*.log