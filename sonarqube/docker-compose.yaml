services:
  sonarqube:
    image: sonarqube:26.9.0.129388-community
    container_name: sonarqube
    depends_on:
      sonarqube-db:
        condition: service_healthy
    ports:
      # Bound to all interfaces so it's reachable over Tailscale directly;
      # SonarQube's own login still gates access.
      - "0.0.0.0:${SONAR_PORT:-9000}:9000"
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://sonarqube-db:5432/sonarqube
      - SONAR_JDBC_USERNAME=${SONAR_USER}
      - SONAR_JDBC_PASSWORD=${SONAR_PASSWORD}
    volumes:
      - /var/data/sonarqube/data:/opt/sonarqube/data
      - /var/data/sonarqube/extensions:/opt/sonarqube/extensions
      - /var/data/sonarqube/logs:/opt/sonarqube/logs
      - /var/data/sonarqube/temp:/opt/sonarqube/temp
    networks:
      - sonarnet
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: 4g
    restart: unless-stopped

  sonarqube-db:
    image: postgres:15.19
    container_name: sonarqube-db
    environment:
      - POSTGRES_USER=${SONAR_USER}
      - POSTGRES_PASSWORD=${SONAR_PASSWORD}
      - POSTGRES_DB=sonarqube
    volumes:
      - /var/data/sonarqube/postgresql:/var/lib/postgresql/data
    networks:
      - sonarnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SONAR_USER} -d sonarqube"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 1g
    restart: unless-stopped

networks:
  sonarnet:
    driver: bridge
