services:
  syncthing:
    # Version Pinning: never use ':latest' — pin an explicit tag for predictable deployments.
    image: syncthing/syncthing:2.1.3
    container_name: syncthing
    hostname: homelab-syncthing
    restart: unless-stopped

    environment:
      # Match host user so synced files keep sane ownership on bind mounts.
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Asia/Bangkok}

    ports:
      # Web UI — bind to localhost only; reach it through a reverse proxy.
      - "${GUI_BIND:-127.0.0.1}:${GUI_PORT:-8384}:8384"
      # Sync protocol (TCP + QUIC/UDP) — must be reachable by peers.
      - "${SYNC_PORT:-22000}:22000/tcp"
      - "${SYNC_PORT:-22000}:22000/udp"
      # Local discovery broadcasts.
      - "${DISCOVERY_PORT:-21027}:21027/udp"

    volumes:
      # Syncthing config, keys and database.
      - ./config:/var/syncthing/config
      # Synced data lives here — add per-folder subdirectories as needed.
      - ./data:/var/syncthing/data

    # Prevents the container from gaining additional privileges.
    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD", "curl", "-fkLsS", "-m", "5", "http://127.0.0.1:8384/rest/noauth/health"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s

    # Resource limits to keep indexing/scanning from starving the host.
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 128M
