---
# For configuration options and examples, please see:
# https://gethomepage.dev/latest/configs/services

- Services:
      - N8N:
            icon: n8n.png
            href: http://n8n.jeerasakananta.dev
            description: Workflow automation
            server: my-docker
            container: n8n

      - Open WebUI:
            icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/webp/open-webui-light.webp
            href: https://openwebui.jeerasakananta.dev
            description: web-based AI models
            server: my-docker
            container: open-webui

      - OpenClaw:
            icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/webp/openclaw.webp
            href: https://claw.jeerasakananta.dev
            description: My AI assistant
            server: my-docker
            container: openclaw

      - Excalidraw:
            icon: excalidraw.png
            href: https://excalidraw.jeerasakananta.dev
            description: Whiteboard
            server: my-docker
            container: excalidraw

- Infrastructure:
      - DockHand:
            icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/webp/dockhand.webp
            href: https://dockhand.jeerasakananta.dev/
            description: Docker Management
            siteMonitor: https://dockhand.jeerasakananta.dev/

      - Cockpit:
            icon: si-cockpit
            href: https://cockpit.jeerasakananta.dev
            description: server management
            siteMonitor: https://cockpit.jeerasakananta.dev

      - Proxmox VE:
            icon: proxmox.png
            href: https://proxmox.jeerasakananta.dev
            description: core infrastructure
            widget:
              type: proxmox
              url: "{{HOMEPAGE_VAR_PROXMOX_URL}}"
              username: "{{HOMEPAGE_VAR_PROXMOX_USERNAME}}"
              password: "{{HOMEPAGE_VAR_PROXMOX_PASSWORD}}"
              fields: ["vms", "lxc", "resources.cpu", "resources.mem"]

- CI/CD:
      # - GitLab:
      #     icon: gitlab.png
      #     href: https://gitlab.jeerasakananta.dev
      #     description: My DevOps Platform (Source Control & CI/CD)
      #     server: my-docker
      #     container: gitlab

      - Jenkins:
            icon: jenkins.png
            href: https://jenkins.jeerasakananta.dev
            description: Automation and CI/CD Pipeline
            server: my-docker
            container: jenkins
            widget:
              type: jenkins
              url: https://jenkins.jeerasakananta.dev
              username: "{{HOMEPAGE_VAR_JENKINS_USERNAME}}"
              password: "{{HOMEPAGE_VAR_JENKINS_PASSWORD}}"

      - SonarQube:
            icon: sonarqube.png
            href: https://sonar.jeerasakananta.dev
            description: Code quality and security scanning
            server: my-docker
            container: sonarqube

      - Harbor:
            icon: harbor.png
            href: https://harbor.jeerasakananta.dev
            description: My container registry
            siteMonitor: https://harbor.jeerasakananta.dev

- Development:
      - VSCode-Server:
            icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/webp/visual-studio-code.webp
            href: https://ide.jeerasakananta.dev
            description: VS Code in the browser
            server: my-docker
            container: code-server

      - DBeaver:
            icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/webp/cloudbeaver.webp
            href: https://dbeaver.jeerasakananta.dev
            description: Universal Database Management Tool
            siteMonitor: https://dbeaver.jeerasakananta.dev

      - PGAdmin:
            icon: pgadmin.png
            href: https://pgadmin.jeerasakananta.dev
            description: PostgreSQL database management
            server: my-docker
            container: pgadmin4

- Monitoring & Logs:
      - Uptime Kuma:
            icon: uptime-kuma.png
            href: https://kuma.jeerasakananta.dev
            description: Service uptime monitoring
            server: my-docker
            container: uptime-kuma

      - Grafana:
            icon: grafana.png
            href: https://grafana.jeerasakananta.dev
            description: Analytics and visualization
            server: my-docker
            container: grafana
            widget:
              type: grafana
              url: https://grafana.jeerasakananta.dev
              username: "{{HOMEPAGE_VAR_GRAFANA_USERNAME}}"
              password: "{{HOMEPAGE_VAR_GRAFANA_PASSWORD}}"
              fields: ["totalalerts", "alertstriggered"]

      - Loki:
            icon: loki.png
            href: https://loki.jeerasakananta.dev
            description: Log aggregation and analysis
            server: my-docker
            container: loki

      - Beszel:
            icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/webp/beszel.webp
            href: https://beszel.jeerasakananta.dev
            description: Server & container monitoring
            server: my-docker
            container: beszel

- Storage:
      - MinIO:
            icon: minio.png
            href: https://minio.jeerasakananta.dev
            description: Object storage server
            server: my-docker
            container: minio

      - Superbase:
            icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/webp/supabase.webp
            href: https://supabase.com/
            description: Firebase alternative
