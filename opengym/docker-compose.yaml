# openGym — self-hosted workout tracker (passkeys, sync, PWA).
# Docs: https://opengym.ch/docs.html#selfhost
# Upstream compose also builds from source and offers an optional AI Coach
# target; this file runs the prebuilt, version-pinned images only.
services:
  api:
    image: ghcr.io/duartesantos8/opengym-api:1.4.1
    container_name: opengym-api
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=3000
      - DATA_DIR=/data
      # Safe here: the API is only reachable through the web container, which
      # overwrites X-Forwarded-For / X-Real-IP with the real peer.
      - TRUST_PROXY=1
    volumes:
      - ./data:/data   # users, passkeys, session secret, uploads — BACK THIS UP

  web:
    image: ghcr.io/duartesantos8/opengym-web:1.4.1
    container_name: opengym-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8090}:80"
    environment:
      - NGINX_PORT=80
      - BACKEND=api
      - PORT=3000
      - RESOLVER=127.0.0.11
      # Leave empty unless Cloudflare is genuinely in front of this container.
      - CF_CONNECTING_IP=${CF_CONNECTING_IP:-}
      - MEDIA_UPLOAD_MAX=${MEDIA_UPLOAD_MAX:-48m}
