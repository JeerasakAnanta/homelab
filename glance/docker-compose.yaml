services:
  glance:
    container_name: ${GLANCE_CONTAINER_NAME:-glance}
    image: glanceapp/glance:${GLANCE_VERSION:-v0.8.6}
    restart: unless-stopped
    ports:
      - ${GLANCE_PORT:-8080}:8080
    env_file: .env
    environment:
      - TZ=${TZ:-Asia/Bangkok}
    volumes:
      - ./config:/app/config
      - ./assets:/app/assets
      - /var/run/docker.sock:/var/run/docker.sock:ro
networks:
  homelab:
    driver: bridge
