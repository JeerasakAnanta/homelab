global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'job', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical-alerts'
      continue: true
    - match:
        severity: warning
      receiver: 'warning-alerts'

receivers:
  - name: 'default'
    telegram_configs:
      - api_url: "https://api.telegram.org"
        bot_token: "${TELEGRAM_BOT_TOKEN}"
        chat_id: "${TELEGRAM_CHAT_ID}"
        parse_mode: "HTML"
        disable_notifications: false

  - name: 'critical-alerts'
    telegram_configs:
      - api_url: "https://api.telegram.org"
        bot_token: "${TELEGRAM_BOT_TOKEN}"
        chat_id: "${TELEGRAM_CHAT_ID}"
        parse_mode: "HTML"
        disable_notifications: false
    webhook_configs:
      - url: "${CRITICAL_WEBHOOK_URL}"
        send_resolved: true

  - name: 'warning-alerts'
    telegram_configs:
      - api_url: "https://api.telegram.org"
        bot_token: "${TELEGRAM_BOT_TOKEN}"
        chat_id: "${TELEGRAM_CHAT_ID}"
        parse_mode: "HTML"
        disable_notifications: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'job', 'instance']