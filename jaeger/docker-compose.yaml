# Jaeger — Distributed Tracing (All-in-One for home lab)
# For production, use separate collector, query, agent with Cassandra/ES backend

services:
  jaeger:
    image: jaegertracing/all-in-one:1.61.0
    container_name: jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"   # UI
      - "6831:6831/udp" # Jaeger agent (Thrift UDP)
      - "6832:6832/udp" # Jaeger agent (Thrift UDP)
      - "14268:14268"   # Collector (HTTP/JSON)
      - "14250:14250"   # Collector (gRPC)
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
      - "14269:14269"   # Health check
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=badger
      - BADGER_EPHEMERAL=false
      - BADGER_DIRECTORY_VALUE=/var/lib/jaeger/badger/data
      - BADGER_DIRECTORY_KEY=/var/lib/jaeger/badger/key
    volumes:
      - jaeger_data:/var/lib/jaeger
    networks:
      - jaeger_net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:14269/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

networks:
  jaeger_net:
    driver: bridge

volumes:
  jaeger_data:
    driver: local