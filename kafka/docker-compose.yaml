# Single-broker Kafka (KRaft mode — no Zookeeper) plus Redpanda Console as the
# web UI. Trimmed for a single-host home lab: one broker, replication factor 1,
# no auth. For learning / experimenting with topics and messages.
#
# First run:
#   cp .env.example .env      # edit KAFKA_ADVERTISED_HOST if connecting from another machine
#   docker compose up -d
# Web UI:      http://<host>:8085
# Bootstrap:   <host>:9092   (localhost by default — set KAFKA_ADVERTISED_HOST for LAN access)

services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-5L6g3nShT-eMCtK--X86sw}
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://${KAFKA_ADVERTISED_HOST:-localhost}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - kafka_net
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  redpanda-console:
    image: redpandadata/console:v2.8.4
    container_name: kafka-console
    restart: unless-stopped
    ports:
      - "${KAFKA_CONSOLE_PORT:-8085}:8080"
    environment:
      KAFKA_BROKERS: kafka:29092
    networks:
      - kafka_net
    depends_on:
      kafka:
        condition: service_healthy

networks:
  kafka_net:
    driver: bridge

volumes:
  kafka-data:
