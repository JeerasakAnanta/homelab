services:
  beszel:
    image: henrygd/beszel:${BESZEL_VERSION:-latest}
    container_name: beszel
    restart: unless-stopped
    ports:
      - "0.0.0.0:${BESZEL_PORT:-8090}:8090"
    volumes:
      - beszel_data:/beszel_data
      - beszel_socket:/beszel_socket
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "/beszel", "health", "--url", "http://localhost:8090"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s

  beszel-agent:
    image: henrygd/beszel-agent:${BESZEL_VERSION:-latest}
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    depends_on:
      - beszel
    volumes:
      - beszel_socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LISTEN: /beszel_socket/beszel.sock
      KEY: ${BESZEL_KEY}
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  beszel_data:
  beszel_socket: