x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  seaweedfs-master:
    image: chrislusf/seaweedfs:${SEAWEEDFS_VERSION}
    container_name: seaweedfs-master
    command: "master -ip=seaweedfs-master -mdir=/data -volumeSizeLimitMB=${VOLUME_SIZE_LIMIT_MB}"
    ports:
      - "${MASTER_PORT}:9333"
      - "${MASTER_GRPC_PORT}:19333"
    volumes:
      - master_data:/data
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9333/cluster/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - seaweed_net

  seaweedfs-volume:
    image: chrislusf/seaweedfs:${SEAWEEDFS_VERSION}
    container_name: seaweedfs-volume
    command: "volume -mserver=seaweedfs-master:9333 -ip=seaweedfs-volume -dir=/data -max=${VOLUME_MAX}"
    ports:
      - "${VOLUME_PORT}:8080"
      - "${VOLUME_GRPC_PORT}:18080"
    volumes:
      - volume_data:/data
    depends_on:
      seaweedfs-master:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - seaweed_net

  seaweedfs-filer:
    image: chrislusf/seaweedfs:${SEAWEEDFS_VERSION}
    container_name: seaweedfs-filer
    command: "filer -master=seaweedfs-master:9333 -ip=seaweedfs-filer"
    ports:
      - "${FILER_PORT}:8888"
      - "${FILER_GRPC_PORT}:18888"
    volumes:
      - filer_data:/data
    depends_on:
      seaweedfs-master:
        condition: service_healthy
      seaweedfs-volume:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8888/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - seaweed_net

  seaweedfs-s3:
    image: chrislusf/seaweedfs:${SEAWEEDFS_VERSION}
    container_name: seaweedfs-s3
    command: "s3 -filer=seaweedfs-filer:8888 -config=/etc/seaweedfs/s3.json"
    ports:
      - "${S3_PORT}:8333"
    volumes:
      - ./s3.json:/etc/seaweedfs/s3.json:ro
    depends_on:
      seaweedfs-filer:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    networks:
      - seaweed_net

volumes:
  master_data:
  volume_data:
  filer_data:

networks:
  seaweed_net:
    driver: bridge
